name: CI/CD Pipeline
# Updated production deployment to use sshpass for consistency with staging
on:
  push:
    branches:
      - main
      - staging
      - dev
  pull_request:
    branches:
      - main
      - staging
      - dev
  workflow_dispatch:
    inputs:
      target:
        description: 'Which environment to deploy (staging or production)'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
jobs:
  test:
    name: Run Tests
    runs-on: [self-hosted, hng-13-runner]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run linting
        run: |
          pip install flake8
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Run tests
        run: |
          pip install pytest pytest-asyncio httpx
          pytest -v || echo "No tests found yet"
  deploy-staging:
    name: Deploy to Staging (Auto)
    runs-on: [self-hosted, hng-13-runner]
    needs: test
    environment: staging
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'
    steps:
      - name: Deploy to staging (password-based)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          APP_DIR: /var/www/mum-mentor-be-staging
        run: |
          set -e
          # Install sshpass (best-effort). Requires sudo on the runner.
          sudo apt-get update || true
          sudo apt-get install -y sshpass || true
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Add server to known_hosts to avoid interactive prompt
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Connect using password and run deploy commands on the remote host
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'EOF'
            set -e
            echo "Starting STAGING deployment..."
            cd /var/www/mum-mentor-be-staging
            # Force reset to match remote
            git fetch origin
            git reset --hard origin/staging
            git clean -fd
            # Activate venv and update
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # --- FIXED migration block ---
            LOCK_DIR="/tmp/deploy_migrations.lock"
            TS=$(date +%Y%m%d_%H%M%S)
            ALEMBIC_CONF="alembic.ini"
            export ENVIRONMENT=staging
            if [ ! -f "$ALEMBIC_CONF" ]; then
              echo "No $ALEMBIC_CONF found, skipping migrations."
            else
              if ! mkdir "$LOCK_DIR" 2>/dev/null; then
                echo "Another deployment is running — aborting.";
                exit 1
              fi
              trap 'rm -rf "$LOCK_DIR"' EXIT
              # Test if alembic can read current state (catches broken chains)
              if ! alembic current > /dev/null 2>&1; then
                echo "⚠️ Broken migration chain detected, cleaning up..."
                sudo -u postgres psql -d mum_mentor_ai_staging -c "DROP TABLE IF EXISTS alembic_version CASCADE;" || true
                rm -f alembic/versions/*.py
                touch alembic/versions/__init__.py
                DB_VERSION="none"
              else
                DB_VERSION=$(sudo -u postgres psql -d mum_mentor_ai_staging -t -c "SELECT version_num FROM alembic_version LIMIT 1;" 2>/dev/null | xargs || echo "none")
              fi
              if [ "$DB_VERSION" = "none" ]; then
                echo "Fresh migration state - generating initial schema..."
                alembic revision --autogenerate -m "server_schema_${TS}"
                
                # Check if migration was created with actual tables
                NEW_FILE=$(ls -t alembic/versions/*.py 2>/dev/null | head -1)
                if [ -f "$NEW_FILE" ] && grep -q "op\.create_table" "$NEW_FILE"; then
                  echo "✅ Initial schema generated, applying..."
                  alembic upgrade head
                else
                  echo "⚠️ No tables to create, stamping empty schema"
                  alembic stamp head
                fi
              else
                echo "Database at version: $DB_VERSION"
                echo "Checking for schema changes..."
                
                # Generate migration and capture output
                alembic revision --autogenerate -m "auto_${TS}" 2>&1 | tee /tmp/alembic_${TS}.log
                
                # Check if changes were detected
                if grep -q "No changes in schema detected" /tmp/alembic_${TS}.log; then
                  echo "✅ No schema changes detected"
                else
                  # Get newest migration file
                  NEW_FILE=$(ls -t alembic/versions/*.py 2>/dev/null | head -1)
                  
                  if [ -f "$NEW_FILE" ]; then
                    # FIXED: Removed semicolon after "op\." - this was the bug!
                    if grep -A 100 "def upgrade():" "$NEW_FILE" | grep -q "op\."; then
                      echo "✅ Schema changes detected, applying migration..."
                      alembic upgrade head
                    else
                      echo "ℹ️ Empty migration generated, removing..."
                      rm "$NEW_FILE"
                    fi
                  fi
                fi
                
                # Handle multiple heads
                HEADS=$(alembic heads 2>/dev/null | grep -E "^[0-9a-f]+" | awk '{print $1}')
                HEAD_COUNT=$(echo "$HEADS" | grep -c "^" || echo "0")
                
                if [ "$HEAD_COUNT" -gt 1 ]; then
                  echo "⚠️ Multiple heads detected, merging..."
                  alembic merge -m "merge_${TS}" heads
                  alembic upgrade head
                fi
              fi
              rm -f /tmp/alembic_${TS}.log 2>/dev/null || true
              
              echo "Final migration status:"
              alembic current || echo "Could not determine current version"
            fi
            # Restart service
            sudo systemctl restart mum-mentor-api-staging
            sudo systemctl status mum-mentor-api-staging --no-pager
            echo "✅ Staging deployment completed successfully!"
          EOF
  deploy-production:
    name: Deploy to Production (Manual)
    runs-on: [self-hosted, hng-13-runner]
    needs: test
    # Only allow manual production deploys via workflow_dispatch and require
    # the 'target' input be 'production'. Protect the production environment
    # in GitHub (required reviewers) for extra safety.
    # Also ensure this job does not run for pushes to the `dev` branch.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'production' && github.ref != 'refs/heads/dev'
    environment: production
    steps:
      - name: Deploy to production server (password-based)
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
          APP_DIR: /var/www/mum-mentor-be
        run: |
          set -e
          # Install sshpass for password-based authentication (mirrors staging approach)
          # This ensures consistency between staging and production deployments
          sudo apt-get update || true
          sudo apt-get install -y sshpass || true
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Add server to known_hosts to avoid interactive prompt
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # Connect using password and run deploy commands on the remote host
          # Using sshpass for consistency with staging deployment method
          sshpass -p "$SERVER_PASSWORD" ssh -o StrictHostKeyChecking=no "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'EOF'
            set -e
            echo "Starting PRODUCTION deployment..."
            cd /var/www/mum-mentor-be
            # Force reset to match remote main
            git fetch origin
            git reset --hard origin/main
            git clean -fd
            # Activate venv and update
            . venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # --- FIXED migration block ---
            LOCK_DIR="/tmp/deploy_migrations.lock"
            TS=$(date +%Y%m%d_%H%M%S)
            ALEMBIC_CONF="alembic.ini"
            export ENVIRONMENT=production
            if [ ! -f "$ALEMBIC_CONF" ]; then
              echo "No $ALEMBIC_CONF found, skipping migrations."
            else
              if ! mkdir "$LOCK_DIR" 2>/dev/null; then
                echo "Another deployment is running — aborting.";
                exit 1
              fi
              trap 'rm -rf "$LOCK_DIR"' EXIT
              # Test if alembic can read current state (catches broken chains)
              if ! alembic current > /dev/null 2>&1; then
                echo "⚠️ Broken migration chain detected, cleaning up..."
                sudo -u postgres psql -d mum_mentor_ai_prod -c "DROP TABLE IF EXISTS alembic_version CASCADE;" || true
                rm -f alembic/versions/*.py
                touch alembic/versions/__init__.py
                DB_VERSION="none"
              else
                DB_VERSION=$(sudo -u postgres psql -d mum_mentor_ai_prod -t -c "SELECT version_num FROM alembic_version LIMIT 1;" 2>/dev/null | xargs || echo "none")
              fi
              if [ "$DB_VERSION" = "none" ]; then
                echo "Fresh migration state - generating initial schema..."
                alembic revision --autogenerate -m "server_schema_${TS}"
                
                # Check if migration was created with actual tables
                NEW_FILE=$(ls -t alembic/versions/*.py 2>/dev/null | head -1)
                if [ -f "$NEW_FILE" ] && grep -q "op\.create_table" "$NEW_FILE"; then
                  echo "✅ Initial schema generated, applying..."
                  alembic upgrade head
                else
                  echo "⚠️ No tables to create, stamping empty schema"
                  alembic stamp head
                fi
              else
                echo "Database at version: $DB_VERSION"
                echo "Checking for schema changes..."
                
                # Generate migration and capture output
                alembic revision --autogenerate -m "auto_${TS}" 2>&1 | tee /tmp/alembic_${TS}.log
                
                # Check if changes were detected
                if grep -q "No changes in schema detected" /tmp/alembic_${TS}.log; then
                  echo "✅ No schema changes detected"
                else
                  # Get newest migration file
                  NEW_FILE=$(ls -t alembic/versions/*.py 2>/dev/null | head -1)
                  
                  if [ -f "$NEW_FILE" ]; then
                    # FIXED: Removed semicolon after "op\." - this was the bug!
                    if grep -A 100 "def upgrade():" "$NEW_FILE" | grep -q "op\."; then
                      echo "✅ Schema changes detected, applying migration..."
                      alembic upgrade head
                    else
                      echo "ℹ️ Empty migration generated, removing..."
                      rm "$NEW_FILE"
                    fi
                  fi
                fi
                
                # Handle multiple heads
                HEADS=$(alembic heads 2>/dev/null | grep -E "^[0-9a-f]+" | awk '{print $1}')
                HEAD_COUNT=$(echo "$HEADS" | grep -c "^" || echo "0")
                
                if [ "$HEAD_COUNT" -gt 1 ]; then
                  echo "⚠️ Multiple heads detected, merging..."
                  alembic merge -m "merge_${TS}" heads
                  alembic upgrade head
                fi
              fi
              rm -f /tmp/alembic_${TS}.log 2>/dev/null || true
              
              echo "Final migration status:"
              alembic current || echo "Could not determine current version"
            fi
            # Restart service
            sudo systemctl restart mum-mentor-api
            sudo systemctl status mum-mentor-api --no-pager
            echo "✅ Production deployment completed successfully!"
          EOF
          # TODO: When SSH key authentication is available, replace sshpass with:
          # ssh -i ~/.ssh/production_key "$SERVER_USER@$SERVER_HOST" 'bash -s' <<'EOF'
          # This will provide better security than password authentication
